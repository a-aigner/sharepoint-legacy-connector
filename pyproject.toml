[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spconnect"
version = "0.1.0"
description = "Read-only extraction connector for legacy on-premises SharePoint (WSS 2.0/3.0, MOSS 2007) via the classic ASMX SOAP services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "requests>=2.31",
    "requests-ntlm>=1.2",
    "lxml>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# SP_AUTH_MODE=integrated: authenticate as the current process identity, so no
# password ever enters the process. Platform-specific, hence optional.
windows = ["requests-negotiate-sspi>=0.5; sys_platform == 'win32'"]
kerberos = ["requests-gssapi>=1.2.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
    "lxml-stubs",
]

[project.scripts]
spconnect = "spconnect.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/spconnect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["spconnect"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # typer uses function calls in argument defaults by design
    "RUF001", # ambiguous unicode in strings: the fixtures are deliberately German
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["spconnect"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["requests_ntlm.*"]
ignore_missing_imports = true
